<script>
  /* ONE forward, not two. The previous build carried both a <meta http-equiv=
     "refresh"> and this replace(), so some browsers navigated twice and the
     back button needed two presses to leave the site.

     The storefront itself lives in TSUMUGI.dc.html because the component
     runtime resolves its screens as siblings of that filename. This document
     therefore holds the crawlable metadata and hands over immediately; the
     storefront then keeps <title> and the description in step with the route
     (see _syncDocumentMeta in TSUMUGI.dc.html).

     Known limitation, stated rather than hidden: with a hash router, a crawler
     that does not execute JavaScript sees only this page's metadata for every
     route. Per-page metadata for products and articles needs build-time
     prerendering — BUILD.md describes the generator and why it is not wired up
     in this snapshot. */
  (function () {
    var hash = location.hash || "";
    location.replace("./TSUMUGI.dc.html" + (location.search || "") + hash);
  })();
</script>

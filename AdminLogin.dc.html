<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:#F6F5F2">
  <div style="width:100%;max-width:420px;animation:admRise 320ms ease both">
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:28px">
      <img src="{{ logoUrl }}" alt="TSUMUGI Vintage Shop" width="145" height="27" style="display:block;width:190px;max-width:100%;height:auto">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.28em;color:#8C887F">{{ t.authAdministration }}</span>
    </div>

    <form onSubmit="{{ onSubmit }}" style="background:#FFFFFF;border:1px solid #E3DFD7;padding:28px;display:flex;flex-direction:column;gap:18px">
      <h1 style="margin:0;font-size:19px;font-weight:600;letter-spacing:-0.01em">{{ t.signIn }}</h1>

      <div id="adm-login-err" aria-live="polite">
        <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
          <div role="alert" style="display:flex;gap:10px;align-items:flex-start;background:#FBF0EE;border:1px solid #E7CFC9;padding:12px 14px">
            <span aria-hidden="true" style="color:#A2493C;font-size:13px;line-height:1.5">!</span>
            <span style="font-size:13px;line-height:1.55;color:#8A3F33">{{ error }}</span>
          </div>
        </sc-if>
      </div>

      <div style="display:flex;flex-direction:column;gap:7px">
        <label for="adm-email" style="font-size:12px;font-weight:500;letter-spacing:0.04em;color:#55534C">{{ t.emailAddress }}</label>
        <input id="adm-email" name="email" type="email" autocomplete="username" required="{{ true }}" value="{{ email }}" onChange="{{ onEmail }}" aria-invalid="{{ invalid }}" aria-describedby="adm-login-err" style="border:1px solid #DAD5CB;background:#FCFBF9;padding:11px 12px;font-size:14px;min-height:44px" style-focus="border-color:#6D7761;background:#FFFFFF">
      </div>

      <div style="display:flex;flex-direction:column;gap:7px">
        <label for="adm-pass" style="font-size:12px;font-weight:500;letter-spacing:0.04em;color:#55534C">{{ t.password }}</label>
        <input id="adm-pass" name="password" type="password" autocomplete="current-password" required="{{ true }}" value="{{ password }}" onChange="{{ onPassword }}" aria-invalid="{{ invalid }}" aria-describedby="adm-login-err" style="border:1px solid #DAD5CB;background:#FCFBF9;padding:11px 12px;font-size:14px;min-height:44px" style-focus="border-color:#6D7761;background:#FFFFFF">
      </div>

      <label style="display:flex;align-items:center;gap:9px;font-size:13px;color:#55534C;cursor:pointer;min-height:44px">
        <input type="checkbox" checked="{{ remember }}" onChange="{{ onRemember }}" style="width:16px;height:16px;accent-color:#6D7761">
        <span>{{ t.rememberMe }}</span>
      </label>

      <button type="submit" disabled="{{ busy }}" style="border:none;background:#6D7761;color:#FFFFFF;padding:13px 18px;font-size:14px;font-weight:500;letter-spacing:0.05em;cursor:pointer;min-height:46px;opacity:{{ submitOpacity }};transition:background 160ms ease" style-hover="background:#59614F" style-active="background:#4C5344">{{ submitLabel }}</button>

      <div style="display:flex;align-items:center;gap:12px">
        <span aria-hidden="true" style="flex:1;height:1px;background:#EAE6DE"></span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#A8A398">{{ t.authOr }}</span>
        <span aria-hidden="true" style="flex:1;height:1px;background:#EAE6DE"></span>
      </div>

      <button type="button" onClick="{{ onGuest }}" disabled="{{ guestBusy }}" style="border:1px solid #DAD5CB;background:#FFFFFF;color:#3F3D38;padding:12px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;cursor:pointer;min-height:46px;opacity:{{ guestOpacity }}" style-hover="border-color:#6D7761;color:#6D7761">{{ guestLabel }}</button>
      <span style="font-size:12.5px;line-height:1.6;color:#8C887F">{{ t.guestNoticeBody }}</span>
    </form>

    <sc-if value="{{ showDemo }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:18px;border:1px dashed #D8D3C9;background:#FBFAF7;padding:14px 16px;display:flex;flex-direction:column;gap:5px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;color:#8C887F">{{ t.demoCreds }}</span>
        <span style="font-size:12.5px;line-height:1.6;color:#77736B">{{ t.authLocalMode }}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#3F3D38">{{ demoEmail }}</span>
        <button type="button" onClick="{{ onFillDemo }}" style="align-self:flex-start;margin-top:6px;border:1px solid #DAD5CB;background:#FFFFFF;padding:8px 12px;font-size:12px;cursor:pointer;min-height:36px" style-hover="border-color:#6D7761;color:#6D7761">{{ t.kFillCredentials }}</button>
      </div>
    </sc-if>

    <a href="./" style="display:inline-block;margin-top:20px;font-size:13px;color:#6D7761">{{ t.kBackToThePublicStore }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:760},&quot;email&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;password&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;remember&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;busy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;guestBusy&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showDemo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;demoEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onEmail&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onPassword&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onRemember&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onGuest&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onFillDemo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;}}">
/* Sign-in screen. A pure view: the shell owns every value and handler, and the
   auth service owns the provider. Nothing here touches the store, and the typed
   password is never written anywhere but the field it came from. */
class Component extends DCLogic {
  _lang() { const S = window.TSUMUGI_STORE; return (S && S.lang) ? S.lang() : "en"; }
  renderVals() {
    const I = window.TSUMUGI_I18N;
    const T = I ? I.t(this._lang()) : {};
    const p = this.props;
    const busy = !!p.busy, guestBusy = !!p.guestBusy;
    return {
      t: T,
      logoUrl: (window.TSUMUGI_IMAGES && window.TSUMUGI_IMAGES.asset)
        ? window.TSUMUGI_IMAGES.asset("assets/tsumugi-logo.svg")
        : "assets/tsumugi-logo.svg",
      email: p.email ?? "",
      password: p.password ?? "",
      remember: p.remember !== false,
      error: p.error ?? "",
      hasError: !!p.error,
      invalid: p.error ? "true" : "false",
      busy, guestBusy,
      submitLabel: busy ? (T.kSigningIn || T.signIn) : T.signIn,
      submitOpacity: busy ? 0.6 : 1,
      guestLabel: guestBusy ? T.authGuestWait : T.authGuestEnter,
      guestOpacity: guestBusy ? 0.6 : 1,
      showDemo: !!p.showDemo,
      demoEmail: p.demoEmail ?? "",
      onEmail: p.onEmail, onPassword: p.onPassword, onRemember: p.onRemember,
      onSubmit: p.onSubmit, onGuest: p.onGuest, onFillDemo: p.onFillDemo
    };
  }
}
</script>
</body>
</html>

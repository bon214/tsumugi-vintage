<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="animation:fadeUp 400ms ease both">
        <section style="padding:clamp(40px,7vh,90px) clamp(20px,4vw,64px) clamp(56px,9vh,110px);display:flex;flex-direction:column;gap:clamp(24px,4vh,44px)">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#9C978F">{{ vm.t.crumbCart }}</span>
          <h1 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(25px,3.2vw,36px);font-weight:400">{{ vm.t.yourSelection }}</h1>
          <sc-if value="{{ vm.cartEmpty }}" hint-placeholder-val="{{ true }}">
            <div style="display:flex;flex-direction:column;gap:20px;padding:40px 0 80px;max-width:520px">
              <p style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(19px,2vw,23px);line-height:1.55;color:#4A4740">{{ vm.t.cartEmptyLong }}</p>
              <button type="button" onClick="{{ vm.goShop }}" style="border:1px solid #B8B1A6;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;padding:18px 32px;min-height:52px;width:fit-content;white-space:nowrap;cursor:pointer;color:#222222;transition:background 320ms ease" style-hover="background:#EFE9E0">{{ vm.t.browseArchive }}</button>
            </div>
          </sc-if>
          <sc-if value="{{ vm.cartHasItems }}" hint-placeholder-val="{{ false }}">
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,4vw,64px);align-items:start">
              <div style="min-width:0;display:flex;flex-direction:column">
                <sc-for list="{{ vm.cartPageItems }}" as="c" hint-placeholder-count="1">
                  <div style="display:flex;gap:clamp(16px,2vw,26px);padding:24px 0;border-top:1px solid #E6E0D7">
                    <div style="min-width:0;position:relative;width:clamp(96px,12vw,140px);aspect-ratio:3/4;flex:none;background:#E4DCD1;overflow:hidden"><img loading="lazy" decoding="async" src="{{ c.thumb }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.86) sepia(0.1) contrast(1.02)"></div>
                    <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0">
                      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#9C978F">{{ c.meta }}</span>
                      <span style="font-family:'EB Garamond',serif;font-size:clamp(19px,2vw,23px);line-height:1.3">{{ c.name }}</span>
                      <p style="margin:0;font-size:13px;line-height:1.75;color:#6D7761">{{ c.short }}</p>
                      <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;gap:16px">
                        <span style="font-size:13px;color:#222222">{{ c.priceLabel }}</span>
                        <button type="button" onClick="{{ c.onRemove }}" style="border:none;background:transparent;font-size:13px;color:#9C978F;cursor:pointer;padding:8px 0;min-height:44px" style-hover="color:#222222">{{ vm.t.remove }}</button>
                      </div>
                    </div>
                  </div>
                </sc-for>
              </div>
              <aside style="min-width:0;background:#EFE9E0;padding:clamp(22px,3vw,36px);display:flex;flex-direction:column;gap:18px;position:sticky;top:110px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.22em;color:#6D7761">{{ vm.t.orderSummary }}</span>
                <div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid #DFD6C9">
                  <span style="font-size:13px;color:#4A4740">{{ vm.t.subtotal }}</span><span style="font-family:'EB Garamond',serif;font-size:20px">{{ vm.cartTotal }}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;border-bottom:1px solid #DFD6C9">
                  <span style="font-size:13px;color:#4A4740">{{ vm.t.shippingJapan }}</span><span style="font-size:13px;color:#4A4740">{{ vm.shippingLabel }}</span>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:baseline">
                  <span style="font-size:13px;color:#222222">{{ vm.t.total }}</span><span style="font-family:'EB Garamond',serif;font-size:clamp(20px,2.4vw,28px)">{{ vm.cartTotal }}</span>
                </div>
                <button type="button" onClick="{{ vm.goCheckoutInfo }}" style="border:none;background:#222222;color:#F8F7F4;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;padding:20px;min-height:54px;cursor:pointer;transition:background 320ms ease" style-hover="background:#6D7761">{{ vm.t.proceedCheckout }}</button>
                <span style="font-size:12px;line-height:1.7;color:#9C978F">{{ vm.t.holdNote }}</span>
              </aside>
            </div>
          </sc-if>
        </section>
      </div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
/* Cart page view — line items, subtotal and checkout CTA. The global cart drawer stays in the shell.
   Presentational only: every value and handler arrives in the `vm` prop built
   by TSUMUGI.dc.html, which keeps all state, business logic and listeners. */
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

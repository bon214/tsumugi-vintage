<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="animation:fadeUp 400ms ease both">
        <sc-if value="{{ vm.articleMissing }}" hint-placeholder-val="{{ false }}">
          <section style="padding:clamp(60px,14vh,160px) clamp(20px,4vw,64px);display:flex;flex-direction:column;gap:22px;align-items:flex-start;max-width:640px">
            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.24em;color:#6D7761">{{ vm.art.kicker }}</span>
            <h1 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(25px,3.2vw,36px);font-weight:400;line-height:1.15;color:#222222">{{ vm.t.articleNotFound }}</h1>
            <p style="margin:0;font-size:15px;line-height:1.9;color:#4A4740;text-wrap:pretty">{{ vm.t.articleNotFoundBody }}</p>
            <button type="button" onClick="{{ vm.goJournal }}" style="border:1px solid #B8B1A6;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;padding:16px;min-height:48px;white-space:nowrap;cursor:pointer;color:#222222" style-hover="border-color:#222222">{{ vm.t.backToJournal }}</button>
          </section>
        </sc-if>

        <sc-if value="{{ vm.articleFound }}" hint-placeholder-val="{{ true }}">
          <article>
            <div style="padding:clamp(18px,3vh,26px) clamp(20px,4vw,64px)">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#9C978F">{{ vm.art.crumb }}</span>
            </div>

            <header style="padding:0 clamp(20px,4vw,64px) clamp(28px,5vh,48px);display:flex;flex-direction:column;gap:18px;max-width:760px">
              <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#6D7761">{{ vm.art.kicker }}</span>
              <h1 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(25px,3.2vw,36px);font-weight:400;line-height:1.14;letter-spacing:-0.01em;color:#222222;text-wrap:pretty">{{ vm.art.title }}</h1>
              <p style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(19px,2vw,23px);line-height:1.65;color:#4A4740;text-wrap:pretty">{{ vm.art.summary }}</p>
              <dl style="margin:0;display:flex;gap:26px;flex-wrap:wrap;padding-top:6px;border-top:1px solid #E6E0D7">
                <sc-for list="{{ vm.art.meta }}" as="m" hint-placeholder-count="3">
                  <div style="display:flex;flex-direction:column;gap:4px;padding-top:14px">
                    <dt style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#9C978F">{{ m.k }}</dt>
                    <dd style="margin:0;font-size:13px;color:#4A4740">{{ m.v }}</dd>
                  </div>
                </sc-for>
              </dl>
            </header>

            <sc-if value="{{ vm.art.hasImage }}" hint-placeholder-val="{{ true }}">
              <figure style="margin:0 0 clamp(28px,5vh,52px)">
                <div style="width:100%;aspect-ratio:16/9;background:#E4DCD1;overflow:hidden">
                  <img loading="lazy" decoding="async" src="{{ vm.art.image }}" alt="{{ vm.art.imageAlt }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.88) contrast(1.02)">
                </div>
              </figure>
            </sc-if>

            <div style="padding:0 clamp(20px,4vw,64px);max-width:720px;font-size:15px;line-height:1.95;color:#33322E" data-article-body>{{ vm.art.bodyNode }}</div>

            <sc-if value="{{ vm.art.hasTags }}" hint-placeholder-val="{{ false }}">
              <div style="padding:clamp(28px,5vh,44px) clamp(20px,4vw,64px) 0;display:flex;gap:9px;flex-wrap:wrap;max-width:720px">
                <sc-for list="{{ vm.art.tags }}" as="tg" hint-placeholder-count="2">
                  <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.14em;padding:7px 11px;background:#EFEBE3;color:#6D7761">{{ tg }}</span>
                </sc-for>
              </div>
            </sc-if>

            <sc-if value="{{ vm.art.hasRelated }}" hint-placeholder-val="{{ false }}">
              <section style="padding:clamp(40px,7vh,80px) clamp(20px,4vw,64px) 0;display:flex;flex-direction:column;gap:22px">
                <h2 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(19px,2vw,23px);line-height:1.3;font-weight:400">{{ vm.t.inThisPiece }}</h2>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:clamp(18px,2.4vw,32px)">
                  <sc-for list="{{ vm.art.related }}" as="p" hint-placeholder-count="2">
                    <article style="min-width:0;display:flex;flex-direction:column;gap:12px">
                      <button type="button" onClick="{{ p.onOpen }}" aria-label="{{ p.name }}" style="min-width:0;width:100%;align-self:start;position:relative;aspect-ratio:3/4;background:#E4DCD1;border:none;padding:0;cursor:pointer;overflow:hidden">
                        <img loading="lazy" decoding="async" src="{{ p.card }}" alt="{{ p.shot }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.86) sepia(0.1) contrast(1.02)">
                      </button>
                      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#9C978F">{{ p.meta }}</span>
                      <button type="button" onClick="{{ p.onOpen }}" style="border:none;background:transparent;padding:0;text-align:left;font-family:'EB Garamond',serif;font-size:20px;color:#222222;cursor:pointer;min-height:44px">{{ p.name }}</button>
                      <span style="font-size:13px;color:#4A4740">{{ p.priceLabel }}</span>
                    </article>
                  </sc-for>
                </div>
              </section>
            </sc-if>

            <nav aria-label="{{ vm.art.kicker }}" style="padding:clamp(40px,7vh,80px) clamp(20px,4vw,64px) clamp(56px,9vh,110px);display:flex;flex-direction:column;gap:16px;border-top:1px solid #E6E0D7;margin-top:clamp(40px,7vh,80px)">
              <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between">
                <sc-if value="{{ vm.art.hasNext }}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{ vm.art.onNext }}" style="flex:1 1 240px;min-width:0;border:1px solid #E0D8CB;background:transparent;padding:18px;min-height:64px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start" style-hover="border-color:#222222">
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#9C978F">{{ vm.t.nextArticle }}</span>
                    <span style="font-family:'EB Garamond',serif;font-size:17px;color:#222222;text-wrap:pretty">{{ vm.art.nextTitle }}</span>
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#9C978F">{{ vm.art.nextDate }}</span>
                  </button>
                </sc-if>
                <sc-if value="{{ vm.art.hasPrev }}" hint-placeholder-val="{{ false }}">
                  <button type="button" onClick="{{ vm.art.onPrev }}" style="flex:1 1 240px;min-width:0;margin-left:auto;border:1px solid #E0D8CB;background:transparent;padding:18px;min-height:64px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-end" style-hover="border-color:#222222">
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#9C978F">{{ vm.t.previousArticle }}</span>
                    <span style="font-family:'EB Garamond',serif;font-size:17px;color:#222222;text-wrap:pretty">{{ vm.art.prevTitle }}</span>
                    <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#9C978F">{{ vm.art.prevDate }}</span>
                  </button>
                </sc-if>
              </div>
              <button type="button" onClick="{{ vm.art.onBack }}" style="align-self:flex-start;border:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;padding:12px 0;min-height:48px;white-space:nowrap;cursor:pointer;color:#6D7761" style-hover="color:#222222">{{ vm.art.backLabel }}</button>
            </nav>
          </article>
        </sc-if>
      </div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
/* Journal / News article view — one resolved entry, its siblings and related pieces.
   Presentational only: every value and every handler arrives in the `vm` prop
   built by TSUMUGI.dc.html, which keeps all state, routing and listeners. */
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

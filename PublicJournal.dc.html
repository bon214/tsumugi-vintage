<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
      <div style="animation:fadeUp 400ms ease both">
        <section style="padding:clamp(40px,7vh,90px) clamp(20px,4vw,64px) clamp(28px,5vh,56px);display:flex;flex-direction:column;gap:20px;border-bottom:1px solid #E6E0D7">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;color:#9C978F">{{ vm.t.crumbJournal }}</span>
          <h1 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(25px,3.2vw,36px);font-weight:400;line-height:1.14">{{ vm.t.journal }}</h1>
          <p style="margin:0;font-size:15px;line-height:1.9;color:#4A4740;max-width:560px;white-space:pre-line">{{ vm.t.journalIntro }}</p>
        </section>
        <section style="padding:clamp(32px,6vh,72px) clamp(20px,4vw,64px) clamp(56px,9vh,110px);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:clamp(28px,3.4vw,48px) clamp(22px,2.6vw,40px)">
          <sc-for list="{{ vm.journalAll }}" as="j" hint-placeholder-count="4">
            <article onClick="{{ j.onOpen }}" style="min-width:0;display:flex;flex-direction:column;gap:clamp(16px,2vw,22px);padding-bottom:clamp(24px,4vh,40px);border-bottom:1px solid #E6E0D7;cursor:pointer">
              <div style="min-width:0;position:relative;aspect-ratio:4/3;background:#E4DCD1;overflow:hidden"><img loading="lazy" decoding="async" src="{{ j.img }}" alt="{{ j.shot }}" style="width:100%;height:100%;object-fit:cover;display:block;filter:saturate(0.86) sepia(0.1) contrast(1.02)"></div>
              <div style="min-width:0;display:flex;flex-direction:column;gap:14px">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.2em;color:#9C978F">{{ j.date }}</span>
                <h2 style="margin:0;font-family:'EB Garamond',serif;font-size:clamp(19px,2vw,23px);line-height:1.3;font-weight:400;text-wrap:pretty">{{ j.title }}</h2>
                <p style="margin:0;font-size:13px;line-height:1.9;color:#4A4740">{{ j.dek }}</p>
                <button type="button" onClick="{{ j.onOpen }}" style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#222222;border:none;border-bottom:1px solid #C9C2B7;background:transparent;padding:0 0 8px;min-height:44px;width:fit-content;text-align:left;white-space:nowrap;cursor:pointer">{{ vm.t.continueReading }}</button>
              </div>
            </article>
          </sc-for>
        </section>
      </div></x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;vm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
/* Journal index view — the published entry cards.
   Presentational only: every value and every handler arrives in the `vm` prop
   built by TSUMUGI.dc.html, which keeps all state, routing and listeners. */
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
